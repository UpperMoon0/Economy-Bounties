plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

def sharedProperties = new Properties(); file('../gradle.properties').withInputStream { sharedProperties.load(it) }
def p = { String name -> (findProperty(name) ?: sharedProperties.getProperty(name))?.toString() ?: { throw new GradleException("Missing ${name}") }() }
ext.minecraft_version=p('minecraft_version_26_1_2'); ext.minecraft_version_range=p('minecraft_version_range_26_1_2'); ext.neo_version=p('neoforge_version_26_1_2')
ext.openui_version=p('openui_version'); ext.economy_version=p('economy_version'); ext.mod_id=p('mod_id'); ext.mod_name=p('mod_name'); ext.mod_license=p('mod_license')
ext.mod_version=p('mod_version'); ext.mod_group_id=p('maven_group'); ext.archives_name=p('archives_name'); ext.mod_authors=p('mod_authors'); ext.mod_description=p('mod_description')
version=mod_version; group=mod_group_id

sourceSets.main.resources.srcDir('../common/src/main/resources')
sourceSets.main.java.srcDir('../shared/minecraft-26plus/src/main/java')
def commonSources = objects.sourceDirectorySet('commonSources','common sources'); commonSources.srcDir('../common/src/main/java'); sourceSets.main.java.source(commonSources)
sourceSets.test.java.srcDir('../common/src/test/java')
repositories { maven { url 'https://maven.architectury.dev/' } }
base { archivesName = "${archives_name}-neoforge-${minecraft_version}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
neoForge {
    version = project.neo_version
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    implementation("dev.architectury:architectury-neoforge:${architectury_version_26_1_2}") { exclude group:'net.neoforged', module:'neoforge' }
    implementation "com.nstut:economy-neoforge-26.1.2:${economy_version}"
    implementation "com.nstut:openui-mc-neoforge-26.1.2:${openui_version}"
    localRuntime "com.nstut:economy-neoforge-26.1.2:${economy_version}"
    localRuntime "com.nstut:openui-mc-neoforge-26.1.2:${openui_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4'); testImplementation 'org.junit.jupiter:junit-jupiter'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties=[minecraft_version:minecraft_version,minecraft_version_range:minecraft_version_range,neo_version:neo_version,
        openui_version:openui_version,economy_version:economy_version,mod_id:mod_id,mod_name:mod_name,mod_license:mod_license,mod_version:mod_version,
        version:mod_version,mod_authors:mod_authors,mod_description:mod_description]
    inputs.properties replaceProperties; expand replaceProperties; from 'src/main/templates'; into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata; neoForge.ideSyncTask generateModMetadata
processResources { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
publishing { publications { mavenJava(MavenPublication) { artifactId=base.archivesName.get(); from components.java } } }
