pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'economy-bounties'

def allProjects = [
        'common',
        'common-1.20.1', 'fabric-1.20.1', 'forge-1.20.1',
        'common-1.21.1', 'fabric-1.21.1', 'neoforge-1.21.1',
        'neoforge-26.1.2'
] as Set
def requestedTasks = gradle.startParameter.taskNames
def targetedProjects = requestedTasks.findAll { it.startsWith(':') }
        .collect { it.split(':')[1] }.findAll { it in allProjects } as Set
def needsWholeWorkspace = requestedTasks.isEmpty() || requestedTasks.any {
    !it.startsWith(':') || it in ['buildAll', 'testAll', 'testAllVersions']
}
def selected = [] as Set
if (needsWholeWorkspace || targetedProjects.isEmpty()) {
    selected.addAll(allProjects)
} else {
    targetedProjects.each { projectName ->
        switch (projectName) {
            case 'fabric-1.20.1':
            case 'forge-1.20.1': selected.addAll(['common', 'common-1.20.1', projectName]); break
            case 'fabric-1.21.1':
            case 'neoforge-1.21.1': selected.addAll(['common', 'common-1.21.1', projectName]); break
            case 'common-1.20.1':
            case 'common-1.21.1':
            case 'neoforge-26.1.2': selected.addAll(['common', projectName]); break
            default: selected.add(projectName)
        }
    }
}
selected.each { include it }

def firstExisting = { List<String> candidates -> candidates.collect { file(it) }.find { new File(it, 'settings.gradle').isFile() } }
def economyDir = firstExisting(['.deps/Economy', '../Economy'])
if (economyDir != null) {
    includeBuild(economyDir) {
        dependencySubstitution {
            substitute module('com.nstut:economy-fabric-1.20.1') using project(':fabric-1.20.1')
            substitute module('com.nstut:economy-forge-1.20.1') using project(':forge-1.20.1')
            substitute module('com.nstut:economy-fabric-1.21.1') using project(':fabric-1.21.1')
            substitute module('com.nstut:economy-neoforge-1.21.1') using project(':neoforge-1.21.1')
            substitute module('com.nstut:economy-neoforge-26.1.2') using project(':neoforge-26.1.2')
        }
    }
}

def openUiDir = firstExisting(['.deps/OpenUI-MC', '../OpenUI-MC'])
if (openUiDir != null) {
    includeBuild(openUiDir) {
        dependencySubstitution {
            substitute module('com.nstut:openui-mc-common-1.20.1') using project(':common-1.20.1')
            substitute module('com.nstut:openui-mc-fabric-1.20.1') using project(':fabric-1.20.1')
            substitute module('com.nstut:openui-mc-forge-1.20.1') using project(':forge-1.20.1')
            substitute module('com.nstut:openui-mc-common-1.21.1') using project(':common-1.21.1')
            substitute module('com.nstut:openui-mc-fabric-1.21.1') using project(':fabric-1.21.1')
            substitute module('com.nstut:openui-mc-neoforge-1.21.1') using project(':neoforge-1.21.1')
            substitute module('com.nstut:openui-mc-neoforge-26.1.2') using project(':neoforge-26.1.2')
        }
    }
}
