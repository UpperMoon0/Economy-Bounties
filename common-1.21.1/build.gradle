architectury { common rootProject.enabled_platforms_1211.split(',') }

sourceSets.main.java.srcDir('../shared/minecraft-common/src/main/java')
sourceSets.test.java.srcDir('../shared/minecraft-common/src/test/java')

configurations { shadowBundle }

dependencies {
    implementation project(':common')
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "dev.architectury:architectury:${project.architectury_api_version}"
    modCompileOnly "com.nstut:economy-fabric-1.21.1:${rootProject.economy_version}"
    modCompileOnly "com.nstut:openui-mc-common-1.21.1:${rootProject.openui_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources { from(project(':common').sourceSets.main.resources); duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
jar { duplicatesStrategy = DuplicatesStrategy.EXCLUDE; from { project(':common').sourceSets.main.output } }
test { useJUnitPlatform() }
