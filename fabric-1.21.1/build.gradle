plugins { id 'com.gradleup.shadow' }

def commonProject = project(':common-1.21.1')
ext.minecraft_version = commonProject.minecraft_version
ext.architectury_api_version = commonProject.architectury_api_version
ext.fabric_loader_version = commonProject.fabric_loader_version
ext.fabric_api_version = commonProject.fabric_api_version
architectury { platformSetupLoomIde(); fabric() }
sourceSets.main.java.srcDir('../shared/loader-fabric/src/main/java')
configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}
dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${project.architectury_api_version}"
    modImplementation "com.nstut:economy-fabric-1.21.1:${rootProject.economy_version}"
    modImplementation "com.nstut:openui-mc-fabric-1.21.1:${rootProject.openui_version}"
    implementation project(':common')
    common(project(path: ':common-1.21.1', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common-1.21.1', configuration: 'transformProductionFabric')
}
processResources {
    inputs.properties version: project.version, mod_id: rootProject.mod_id, mod_name: rootProject.mod_name, mod_description: rootProject.mod_description,
            mod_authors: rootProject.mod_authors, minecraft_version: project.minecraft_version, fabric_loader_version: project.fabric_loader_version,
            architectury_api_version: project.architectury_api_version, economy_version: rootProject.economy_version, openui_version: rootProject.openui_version
    filesMatching('fabric.mod.json') { expand(inputs.properties) }
}
shadowJar { configurations = [project.configurations.shadowBundle]; archiveClassifier = 'dev-shadow' }
remapJar { inputFile.set shadowJar.archiveFile }
